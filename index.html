<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kanya | My Portfolio</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      /* HOME PAGE */

      body {
        min-height: 100vh;
        background: #080817;
        color: white;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
      }

      .smoke-background {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #30206d, #080817 75%);
        pointer-events: none;
      }

      .smoke-background video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.7;
      }

      .smoke-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(8, 8, 23, 0.45),
          rgba(12, 8, 35, 0.2),
          rgba(8, 8, 23, 0.55)
        );
      }

      .home-page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 45px 25px;
        text-align: center;
      }

      .profile-picture {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #e7c8ff;
        box-shadow: 0 0 25px #9b5cff;
        margin-bottom: 15px;
      }

      .profile h1 {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 2px;
        margin-bottom: 12px;
      }

      .profile p {
        max-width: 460px;
        margin: 0 auto;
        line-height: 1.6;
        color: #e4dff7;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
      }

      .social-links a {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #f0e6fa;
        color: #241637;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .social-links a:hover {
        transform: translateY(-4px);
        box-shadow: 0 0 18px #d7a6ff;
      }

      /* FRAME AROUND THE FOUR CIRCLES */

      .circle-frame {
        width: min(100%, 900px);
        min-height: 190px;
        margin-top: 35px;
        padding: 15px 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(213, 176, 255, 0.25);
        border-radius: 12px;
        background: rgba(13, 10, 38, 0.18);
        box-shadow: 0 0 35px rgba(123, 65, 255, 0.13);
      }

      .home-circle {
        width: clamp(120px, 14vw, 155px);
        aspect-ratio: 1;
        flex-shrink: 0;
        border: none;
        border-radius: 50%;
        color: #2b1738;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 2px;
        cursor: pointer;
        transition: box-shadow 0.3s;
        animation:
          circleDrop 1s cubic-bezier(0.2, 0.8, 0.3, 1) both,
          floatCircle 4s ease-in-out 1.2s infinite;
      }

      .about {
        background: #e5a0e8;
        animation-delay: 0.1s, 1.2s;
      }

      .work {
        background: #e9d6f5;
        animation-delay: 0.3s, 1.4s;
      }

      .interests {
        background: #d98bdf;
        animation-delay: 0.5s, 1.6s;
      }

      .contact {
        background: #cf65d9;
        animation-delay: 0.7s, 1.8s;
      }

      .home-circle:hover {
        box-shadow: 0 0 40px #ecadff;
      }

      .home-circle:focus-visible,
      .social-links a:focus-visible {
        outline: 3px solid white;
        outline-offset: 5px;
      }

      @keyframes circleDrop {
        from {
          opacity: 0;
          transform: translateY(-180px) rotate(-20deg);
        }

        70% {
          transform: translateY(12px) rotate(4deg);
        }

        to {
          opacity: 1;
          transform: translateY(0) rotate(0);
        }
      }

      @keyframes floatCircle {
        0%,
        100% {
          translate: 0 0;
        }

        50% {
          translate: 0 -10px;
        }
      }

      .tagline {
        color: #c9b5ed;
        margin-top: 20px;
        font-size: 13px;
        letter-spacing: 1px;
      }

      /* POWDER BURST */

      .powder-particle {
        position: fixed;
        z-index: 9999;
        pointer-events: none;
        border-radius: 50%;
        will-change: transform, opacity;
        animation: powderExplosion 1.1s ease-out forwards;
      }

      @keyframes powderExplosion {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.2);
          filter: blur(0);
        }

        12% {
          opacity: 1;
        }

        55% {
          opacity: 0.9;
          filter: blur(2px);
        }

        100% {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(var(--size));
          filter: blur(8px);
        }
      }

      /* SMALL SCREENS */

      @media (max-width: 650px) {
        .home-page {
          padding: 35px 16px;
        }

        .circle-frame {
          width: min(100%, 380px);
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          justify-items: center;
          gap: 18px;
          padding: 25px 12px;
        }

        .home-circle {
          width: min(36vw, 145px);
          font-size: 9px;
        }

        .tagline {
          line-height: 1.8;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- SMOKE VIDEO BACKGROUND -->

    <div class="smoke-background" aria-hidden="true">
      <video autoplay muted loop playsinline>
        <source src="assets/smoke.mp4" type="video/mp4" />
      </video>

      <div class="smoke-overlay"></div>
    </div>

    <!-- HOME PAGE -->

    <main class="home-page">
      <!-- PROFILE -->

      <section class="profile">
        <img
          src="assets/profile.jpg"
          alt="My profile"
          class="profile-picture"
        />

        <h1>KANYA</h1>

        <p>
          Aspiring Software Developer passionate about creating beautiful,
          useful and interactive digital experiences.
        </p>

        <!-- SOCIAL LINKS -->

        <div class="social-links">
          <a
            href="https://github.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
            >GH</a
          >

          <a
            href="https://www.linkedin.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            title="LinkedIn"
            >in</a
          >

          <a
            href="mailto:khanya.njenjemane06@gmail.com"
            aria-label="Email me"
            title="Email"
            >@</a
          >
        </div>
      </section>

      <!-- CIRCULAR NAVIGATION -->

      <nav class="circle-frame" aria-label="Portfolio sections">
        <button
          class="home-circle about"
          type="button"
          data-page="about me.html"
        >
          ABOUT
        </button>

        <button class="home-circle work" type="button" data-page="my work.html">
          WORK
        </button>

        <button
          class="home-circle interests"
          type="button"
          data-page="interests.html"
        >
          INTERESTS
        </button>

        <button
          class="home-circle contact"
          type="button"
          data-page="contact.html"
        >
          CONTACT
        </button>
      </nav>

      <p class="tagline">MY JOURNEY · MY CREATIVITY · MY FUTURE</p>
    </main>

    <!-- POWDER BURST AND PAGE NAVIGATION -->

    <script>
      const homeCircles = document.querySelectorAll(".home-circle");

      function createPowderExplosion(circle) {
        const rect = circle.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const colors = [
          "#a855f7",
          "#7c3aed",
          "#ec4899",
          "#f0abfc",
          "#38bdf8",
          "#818cf8",
          "#ffffff",
        ];

        for (let i = 0; i < 100; i++) {
          const particle = document.createElement("span");

          particle.className = "powder-particle";

          const angle = Math.random() * Math.PI * 2;
          const distance = 70 + Math.random() * 230;
          const radius = 3 + Math.random() * 13;

          const x = Math.cos(angle) * distance;
          const y = Math.sin(angle) * distance;

          const color = colors[Math.floor(Math.random() * colors.length)];

          particle.style.left = `${centerX - radius}px`;
          particle.style.top = `${centerY - radius}px`;
          particle.style.width = `${radius * 2}px`;
          particle.style.height = `${radius * 2}px`;
          particle.style.background = color;
          particle.style.boxShadow = `0 0 12px ${color}`;

          particle.style.setProperty("--x", `${x}px`);
          particle.style.setProperty("--y", `${y}px`);
          particle.style.setProperty("--size", String(0.5 + Math.random() * 2));

          document.body.appendChild(particle);

          particle.addEventListener("animationend", function () {
            particle.remove();
          });
        }
      }

      homeCircles.forEach(function (circle) {
        circle.addEventListener("click", function () {
          const page = circle.dataset.page;

          if (!page) {
            return;
          }

          createPowderExplosion(circle);

          circle.disabled = true;

          window.setTimeout(function () {
            window.location.href = page;
          }, 250);
        });
      });
    </script>
  </body>
</html>
