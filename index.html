<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kanya | My Portfolio</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      /* HOME PAGE */

      body {
        min-height: 100vh;
        background: #0b1220;
        color: white;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
      }

      .home-page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 45px 25px;
        text-align: center;
      }

      .profile-picture {
        position: relative;
        z-index: 1;
        width: 218px;
        height: 218px;
        border-radius: 50%;
        object-fit: cover;
        object-position: center 38%;
        border: 3px solid rgba(232, 222, 255, 0.9);
        box-shadow:
          0 0 0 6px rgba(205, 178, 255, 0.07),
          0 12px 34px rgba(3, 8, 24, 0.38),
          0 0 28px rgba(123, 108, 190, 0.32);
      }

      .profile-photo-frame {
        display: grid;
        width: 232px;
        height: 232px;
        margin: 0 auto 18px;
        place-items: center;
      }

      .profile h1 {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 2px;
        margin-bottom: 18px;
      }

      .profile p {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 8px;
        line-height: 1.85;
        color: #e4dff7;
      }

      .social-links {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 25px;
      }

      .social-links a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #f0e6fa;
        color: #241637;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
        cursor: pointer;
      }

      .social-links a:hover {
        transform: translateY(-4px);
        box-shadow: 0 0 18px #d7a6ff;
      }

      .contact-link-wrap {
        position: relative;
      }

      .contact-fallback {
        position: absolute;
        z-index: 3;
        top: calc(100% + 10px);
        left: 50%;
        width: max-content;
        max-width: min(280px, 85vw);
        padding: 9px 12px;
        transform: translateX(-50%);
        border: 1px solid rgba(213, 176, 255, 0.4);
        border-radius: 10px;
        background: rgba(18, 12, 38, 0.96);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        color: white;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .contact-fallback[hidden] {
        display: none;
      }

      .social-links svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }

      /* FRAME AROUND THE THREE CIRCLES */

      .circle-frame {
        width: min(100%, 900px);
        min-height: 190px;
        margin-top: 48px;
        padding: 15px 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(213, 176, 255, 0.25);
        border-radius: 12px;
        background: rgba(13, 10, 38, 0.18);
        box-shadow: 0 0 35px rgba(123, 65, 255, 0.13);
      }

      .home-circle {
        width: clamp(120px, 14vw, 155px);
        aspect-ratio: 1;
        flex-shrink: 0;
        border: none;
        border-radius: 50%;
        color: #2b1738;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 2px;
        cursor: pointer;
        transition: box-shadow 0.3s;
        animation: circleDrop 0.75s cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }

      .about {
        background: #b79be8;
        animation-delay: 0.1s;
      }

      .work {
        background: #ffc0cb;
        animation-delay: 0.2s;
      }

      .reflection {
        background: #bd5fa5;
        animation-delay: 0.3s;
      }

      .home-circle:hover {
        box-shadow: 0 0 40px #f4d5ff;
      }

      .page-reveal {
        position: fixed;
        z-index: 9999;
        width: 150vmax;
        height: 150vmax;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle,
          #26344a 0%,
          #172235 55%,
          #0b1220 100%
        );
        transform: translate(-50%, -50%) scale(0.01);
        animation: pageReveal 650ms cubic-bezier(0.2, 0.75, 0.25, 1) forwards;
      }

      @keyframes pageReveal {
        to {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      .home-circle:focus-visible,
      .social-links a:focus-visible {
        outline: 3px solid white;
        outline-offset: 5px;
      }

      @keyframes circleDrop {
        from {
          opacity: 0;
          transform: translateY(-180px) rotate(-20deg);
        }

        70% {
          transform: translateY(12px) rotate(4deg);
        }

        to {
          opacity: 1;
          transform: translateY(0) rotate(0);
        }
      }

      .tagline {
        color: #c9b5ed;
        margin-top: 26px;
        font-size: 13px;
        letter-spacing: 1px;
      }

      /* SMALL SCREENS */

      @media (max-width: 650px) {
        .home-page {
          padding: 35px 16px;
        }

        .circle-frame {
          width: min(100%, 380px);
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          justify-items: center;
          gap: 18px;
          padding: 25px 12px;
        }

        .home-circle:last-child:nth-child(odd) {
          grid-column: 1 / -1;
        }

        .home-circle {
          width: min(36vw, 145px);
          font-size: 9px;
        }

        .profile-photo-frame {
          width: 198px;
          height: 198px;
          margin-bottom: 16px;
        }

        .profile-picture {
          width: 184px;
          height: 184px;
        }

        .tagline {
          line-height: 1.8;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="portfolio-background" aria-hidden="true"></div>

    <!-- HOME PAGE -->

      <!-- PROFILE -->

        <!-- SOCIAL LINKS -->

        <div class="social-links">
          <a

              <path

              />
            </svg>
          </a>

          <a
            href="https://www.linkedin.com/in/kanya-masinda-436799413"
            aria-label="LinkedIn"
            title="LinkedIn"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.45 2H3.55A1.55 1.55 0 0 0 2 3.55v16.9A1.55 1.55 0 0 0 3.55 22h16.9A1.55 1.55 0 0 0 22 20.45V3.55A1.55 1.55 0 0 0 20.45 2ZM8 19H5V9h3ZM6.5 7.64A1.74 1.74 0 1 1 6.52 4.16a1.74 1.74 0 0 1-.02 3.48ZM19 19h-3v-4.87c0-1.16-.02-2.65-1.62-2.65-1.62 0-1.87 1.27-1.87 2.57V19h-3V9h2.88v1.37h.04a3.16 3.16 0 0 1 2.84-1.56c3.04 0 3.61 2 3.61 4.6Z"

          <div class="contact-link-wrap">
            <a

              href="mailto:khanya.njenjemane06@gmail.com"
              aria-label="Email Kanya"
              aria-expanded="false"
              aria-controls="email-fallback"

            >
              <svg viewBox="0 0 24 24" aria-hidden="true">

              </svg>

            <span class="contact-fallback" id="email-fallback" hidden>
              khanya.njenjemane06@gmail.com

          </div>

          <div class="contact-link-wrap">
            <a
              class="contact-link"
              href="tel:+27656332898"
              aria-label="Call Kanya"
              aria-expanded="false"
              aria-controls="phone-fallback"

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.56 3.57.56.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z" />

      </section>

      <!-- CIRCULAR NAVIGATION -->

      <nav class="circle-frame" aria-label="Portfolio sections">
        <button
          class="home-circle about"
          type="button"
          data-page="about me.html"
        >
          ABOUT
        </button>

        <button class="home-circle work" type="button" data-page="my work.html">
          WORK
        </button>

        <button
          class="home-circle reflection"
          type="button"
          data-page="reflection.html"
        >
          REFLECTION
        </button>
      </nav>

      <p class="tagline">MY JOURNEY · MY CREATIVITY · MY FUTURE</p>
    </main>

    <!-- PAGE NAVIGATION -->

    <script>
      const homeCircles = document.querySelectorAll(".home-circle");
      const contactLinks = document.querySelectorAll(".contact-link");

      contactLinks.forEach(function (link) {
        link.addEventListener("click", function () {
          contactLinks.forEach(function (otherLink) {
            const details = document.getElementById(
              otherLink.getAttribute("aria-controls"),
            );
            details.hidden = true;
            otherLink.setAttribute("aria-expanded", "false");
          });

          document.getElementById(link.getAttribute("aria-controls")).hidden =
            false;
          link.setAttribute("aria-expanded", "true");
        });
      });

      homeCircles.forEach(function (circle) {
        circle.addEventListener("click", function () {
          const page = circle.dataset.page;

          if (!page) {
            return;
          }

          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            window.location.href = page;
            return;
          }

          homeCircles.forEach(function (item) {
            item.disabled = true;
          });

          const rect = circle.getBoundingClientRect();
          const reveal = document.createElement("span");
          reveal.className = "page-reveal";
          reveal.setAttribute("aria-hidden", "true");
          reveal.style.left = `${rect.left + rect.width / 2}px`;
          reveal.style.top = `${rect.top + rect.height / 2}px`;
          reveal.addEventListener(
            "animationend",
            function () {
              window.location.href = page;
            },
            { once: true },
          );
          document.body.appendChild(reveal);
        });
      });
    </script>
  </body>
</html>
