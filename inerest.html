<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      .navigation {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 10px auto 65px;
      }

      .navigation a {
        text-decoration: none;
        color: white;
        font-size: 11px;
        letter-spacing: 1px;
        padding: 13px 18px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 30px;
        background: rgba(20, 14, 35, 0.35);
        backdrop-filter: blur(8px);
        opacity: 0;
        transform: translateY(-40px);
        animation: dropIn 0.7s ease forwards;
        transition: 0.3s;
      }

      .navigation a:nth-child(1) {
        animation-delay: 0.1s;
      }
      .navigation a:nth-child(2) {
        animation-delay: 0.25s;
      }
      .navigation a:nth-child(3) {
        animation-delay: 0.4s;
      }
      .navigation a:nth-child(4) {
        animation-delay: 0.55s;
      }
      .navigation a:nth-child(5) {
        animation-delay: 0.7s;
      }

      .navigation a:hover,
      .navigation a.active {
        color: #f3c0ff;
        border-color: #e69aff;
        box-shadow: 0 0 18px rgba(207, 102, 255, 0.4);
        background: rgba(155, 68, 210, 0.2);
      }

      @keyframes dropIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <!-- NAVIGATION -->
    <nav class="navigation">
      <a href="index.html">HOME</a>
      <a href="about me.html" class="active">ABOUT</a>
      <a href="my work.html">WORK</a>
      <a href="interests.html">INTERESTS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </body>
</html>
